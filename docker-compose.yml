version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingview-telegram-bot
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Telegram Configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      
      # Webhook Security
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-False}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      
      # Rate Limiting
      - RATE_LIMIT_TRADINGVIEW=${RATE_LIMIT_TRADINGVIEW:-60}
      - RATE_LIMIT_TELEGRAM=${RATE_LIMIT_TELEGRAM:-30}
      
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-production}
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    networks:
      - tradingview-network
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tradingview-network:
    driver: bridge
